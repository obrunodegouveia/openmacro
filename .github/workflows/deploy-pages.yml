# Rebuilds the public demo whenever `main` moves.
#
# Deploying by hand works, but a site that drifts from the branch is worse than
# no site — someone reports a bug that was fixed weeks ago. This keeps them in
# step. Only first-party actions are used, so there is no third-party action
# with write access to the repository.
name: Deploy web build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deploy job writes, and only to the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.18+ : `module.registerHooks` (22.15) and unflagged TypeScript
      # type stripping (22.18), both of which scripts/validate-content.mjs
      # relies on to load the real registry without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail the deploy rather than publish a broken lesson.
      - run: npm run typecheck
      - run: npm run lint:content

      # The demo is served from a project subpath, so assets need the prefix.
      # 404.html is the SPA fallback: Pages has no rewrite rules, so a hard
      # refresh on /lesson/... is served this file and the router takes over.
      # Both values are public by design: the publishable key is designed to
      # ship inside the bundle and is gated by row-level security. They are
      # repository *variables*, not secrets, so nothing here implies a
      # protection that does not exist. Leave them unset and the build simply
      # has no account UI — which is the correct fallback for a fork.
      - run: npm run build:pages
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git branch -M gh-pages
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
