# Checks every push to `main` and every pull request.
#
# This used to also publish the Expo web export to GitHub Pages. That target is
# retired: the mobile app is now iOS and Android only, and the web version of
# the course is the Next.js site at openmacro.org, which deploys from
# `web/deploy/deploy.sh`. Keeping two playable web builds meant two things to
# keep in step, and the one nobody was watching would go stale.
#
# Only first-party actions are used, and the workflow has read-only access.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.18+ : `module.registerHooks` (22.15) and unflagged TypeScript
      # type stripping (22.18), both of which scripts/validate-content.mjs
      # relies on to load the real registry without a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The mobile app.
      - run: npm run typecheck

      # Guards the shared package's platform surface: packages/core must keep
      # compiling without DOM or React Native globals, because the website, the
      # mobile app and the content validator all import it.
      - run: npm run typecheck:core

      # Content rules the type system cannot express — double-entry balance on
      # every T-account, formula ids that exist, objectives that target a real
      # readout.
      - run: npm run lint:content

      # Quality rather than validity: duplicated content, a correctOptionId
      # pointing at nothing, two options reading the same. Exits non-zero only
      # on those errors — the style warnings are advisory and reported, not
      # enforced, because a good lesson occasionally has a reason.
      - name: Audit content quality
        run: npm run audit:content

      # The exam engine's claims — a seed rebuilds the same paper, the paper
      # spans the course, the level gate fails a candidate the overall mark
      # would pass. Runs against the live registry, so content that grows or
      # shrinks under the blueprint is caught here rather than by a candidate.
      - name: Exam engine self-test
        run: npm run check:exam

      # The one rule in src/feedback that neither the typechecker nor review
      # will catch: playback never begins from an unknown position. seekTo is
      # async and play is not, so the obvious spelling drops cues or restarts
      # them mid-note depending on timing. Drives the real module against a
      # stub player under interleavings a device produces only occasionally.
      - name: Feedback cue self-test
        run: npm run check:feedback

      # A scheduler is a set of claims about the future and every one of them
      # fails quietly: an ease below its floor turns the queue into the same
      # six cards forever, an unbounded interval stops asking about material
      # the course says a learner still knows. Two simulated years, checked.
      - name: Review scheduler self-test
        run: npm run check:review

      # The other half of the translation guarantee. `i18n:status` proves the
      # catalogue is complete; this proves the app actually *reads* it. A
      # string typed straight into JSX is invisible to typecheck (a string is
      # a string) and invisible to i18n:status (it never became a key), so
      # without this the interface can rot back to English at 100% reported
      # coverage. One rule, tools/eslint/no-untranslated-text.js.
      - name: Lint the app for untranslated strings
        run: npm run lint

      # Messages, not content. Catches a translation that invented a
      # placeholder name or dropped a brace — both render as visible nonsense
      # and neither is a type error. Untranslated content never fails this;
      # a rule that blocks a new lesson until every language has caught up is
      # a rule that stops lessons being written.
      - name: Validate translations
        run: npm run i18n:status -- --strict

      # What can still reach a phone without an App Store round trip.
      #
      # `fingerprint.config.js` claims a list of files cannot affect the native
      # runtime, which is what lets a lesson ship in two minutes instead of two
      # weeks. Every claim is a bet: too conservative and an update reaches
      # nobody, too permissive and a JavaScript bundle calls into native code
      # the binary does not have and crashes on launch, for everyone, with no
      # review in the way. Neither shows up by reading the config, so both
      # directions are asserted against the real tree.
      - name: Fingerprint self-test
        run: npm run check:fingerprint

      # And the consequence, for this particular change. Reports rather than
      # fails: a native change is a fine thing to make, and blocking it here
      # would only teach people to ignore the step. What is expensive is not
      # knowing — merging something that quietly moved the runtime version and
      # discovering it when an update ships to nobody.
      - name: Can this change ship over the air?
        run: npm run update:check -- --report

      # The website, which is what learners actually play.
      - run: npm run typecheck --workspace web
      - run: npm run lint --workspace web
      - run: npm run build --workspace web
