# Publishes an over-the-air update when content changes land on `main`.
#
# This is the point of EAS Update for this project: a lesson is data, and data
# should not need a twenty-minute native build and an App Store review to reach
# anyone. Merge a lesson, and internal builds have it in about two minutes.
#
# It publishes to `preview` only. Production is a deliberate act, because an
# update faces no review — there is nothing between a mistake and a learner
# except the checks below, and "it was on main" is not a good enough reason to
# put something in front of people. Promote with `npm run update:store`, or by
# running this workflow manually with `channel: production`.
#
# Skips itself when a change touches native configuration, because such an
# update cannot reach the builds that are out there anyway — the fingerprint
# runtime version will have changed, and the right answer is a new build.
#
# Needs an EXPO_TOKEN repository secret (an Expo robot token with publish
# rights). Without one it skips with a notice rather than failing every merge
# to main: it used to fail at the very last step, after the checks, so a red
# run here meant "not configured", not "something is wrong".
#
# Only first-party actions, matching ci.yml.
name: Publish content update

on:
  push:
    branches: [main]
    paths:
      # Everything here is JavaScript that ships inside the update bundle, so
      # all of it can travel over the air.
      #
      # This used to name `packages/core/src/content/**` alone, which quietly
      # excluded most of the package: the scheduler in `progress/`, the exam
      # and grading engines, and the entire `i18n/` catalogue. A translation
      # fix landing on main did not publish, and neither did a bug fix in the
      # code that grades an answer — the two things most worth getting to
      # people quickly. The guards inside the job are what make this safe to
      # widen; they check the change is not native regardless of which file
      # triggered the run.
      - 'packages/core/**'
      - 'src/**'
      - 'app/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to publish to
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: content-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Secrets cannot be read in a job-level `if`, so the gate is a step and
      # every step after it checks its output.
      - name: Check for an Expo token
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=Update not published::No EXPO_TOKEN secret is set, so this run publishes nothing. Add an Expo robot token as the EXPO_TOKEN repository secret to publish every merge to preview. Production updates still go out with npm run update:store."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
        with:
          # The update message quotes the commit, so the log needs to exist.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.token.outputs.ready == 'true'
        run: npm ci

      # A native change cannot travel over the air. Publishing one produces an
      # update that no installed build will ever be offered, which looks like a
      # successful deploy and is not one.
      - name: Refuse native changes
        if: steps.token.outputs.ready == 'true'
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD || true)
          if echo "$CHANGED" | grep -qE '^(app\.json|app\.config\.js|package\.json|package-lock\.json|babel\.config\.js|metro\.config\.js)$'; then
            echo "::error::Native or dependency configuration changed — this needs a build, not an update."
            echo "$CHANGED" | grep -E '^(app\.json|app\.config\.js|package\.json|package-lock\.json|babel\.config\.js|metro\.config\.js)$'
            exit 1
          fi

      # The filename guard above is a proxy; this is the real question. An
      # update is only offered to a binary whose fingerprint matches it, so
      # publishing at one nothing in the field carries ships to nobody while
      # reporting success.
      - name: Check the update can reach anything
        if: steps.token.outputs.ready == 'true'
        run: node ./scripts/update-reachability.mjs --channel "${{ inputs.channel || 'preview' }}"

      # The same gates as a build, because an update skips review entirely.
      - name: Typecheck
        if: steps.token.outputs.ready == 'true'
        run: |
          npm run typecheck
          npm run typecheck:core

      - name: Validate content
        if: steps.token.outputs.ready == 'true'
        run: npm run lint:content

      - name: Audit content quality
        if: steps.token.outputs.ready == 'true'
        run: npm run audit:content

      - name: Publish
        if: steps.token.outputs.ready == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ inputs.channel || 'preview' }}
        run: |
          # --environment resolves EXPO_PUBLIC_* for the bundle. Without it an
          # update can ship with no Supabase configuration and no error.
          npx eas-cli@24 update \
            --channel "$CHANNEL" \
            --environment "$CHANNEL" \
            --message "$(git log -1 --pretty=%s)" \
            --non-interactive
