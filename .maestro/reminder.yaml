appId: org.openmacro.app
name: Daily reminder asks for permission, then offers times
---
- runFlow: subflows/launch.yaml
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Daily reminder"
# Start from off: the setting persists between runs, and tapping a switch that
# a previous run left on would turn it off and hide the times.
- runFlow:
    when:
      visible:
        id: "reminder-switch"
        checked: true
    commands:
      - tapOn:
          id: "reminder-switch"
- tapOn:
    id: "reminder-switch"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
# The times open below the switch, which can be past the bottom of the screen.
- scrollUntilVisible:
    element: ".*(19:00|7:00).*"
    timeout: 10000
