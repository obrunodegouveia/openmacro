# ============================================================================
# Cloud Build pipeline for openmacro.org
# ============================================================================
# Invoked by deploy/deploy.sh, and suitable as-is for a GitHub push trigger.
# Builds the image and pushes both an immutable tag and `latest`.

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_GITHUB_REPO=${_GITHUB_REPO}
      - --build-arg
      - NEXT_PUBLIC_DISCORD_URL=${_DISCORD_URL}
      # Supabase. Both are public by design — the publishable key grants only
      # what row-level security allows. Empty is the correct default for a
      # fork: the site then builds with no account UI at all.
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}
      - --build-arg
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      # Reuse the previous image's layers when the lockfile has not changed.
      # Built from the workspace root, so the Dockerfile has to be named.
      - -f
      - web/Dockerfile
      - --cache-from
      - ${_IMAGE}:latest
      - -t
      - ${_IMAGE}:${_TAG}
      - -t
      - ${_IMAGE}:latest
      - .
    env:
      - DOCKER_BUILDKIT=1

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/deep-atlas-484612-m0/openmacro/web
  _TAG: latest
  _GITHUB_REPO: obrunodegouveia/openmacro
  _DISCORD_URL: https://discord.gg/openmacro
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''
  _GOOGLE_CLIENT_ID: ''

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
