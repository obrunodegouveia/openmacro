<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenMacro has moved to openmacro.org</title>

    <!--
      This page used to serve the Expo web build of OpenMacro.

      That target is retired. The mobile app is now iOS and Android only, and
      the web version of the course lives at openmacro.org, where all 30
      lessons are prerendered as real HTML rather than served behind an SPA
      fallback that returned a 404 status to crawlers.

      A redirect rather than a deleted branch, because this URL was published
      in the README and people may have bookmarked it.
    -->
    <link rel="canonical" href="https://openmacro.org/learn" />
    <meta http-equiv="refresh" content="0; url=https://openmacro.org/learn" />
    <meta name="robots" content="noindex" />

    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b12;
        color: #e6edf7;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      a { color: #5eead4; }
      p { max-width: 32rem; color: #93a4bd; }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenMacro has moved</h1>
      <p>
        The course now lives at
        <a href="https://openmacro.org/learn">openmacro.org/learn</a>, with all
        30 lessons. Redirecting you there now.
      </p>
    </main>
    <script>
      // Belt and braces: the meta refresh handles most cases, this covers the
      // rest without waiting for it.
      location.replace("https://openmacro.org/learn");
    </script>
  </body>
</html>
